[package]
name = "modsecurity-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Safe Rust bindings to libmodsecurity v3 (ModSecurity's C API)"
license = "Apache-2.0"
repository = "https://github.com/fzylogic/modsecurity-rs"
readme = "README.md"
keywords = ["modsecurity", "waf", "ffi", "security", "http"]
categories = ["api-bindings", "web-programming"]
links = "modsecurity"

[dependencies]
# Only ever enabled by the `valgrind` feature, which exists purely to build the
# `memcheck` test target. The library itself has no dependencies.
crabgrind = { version = "0.5", optional = true }

[features]
# Builds `tests/memcheck.rs`, which drives Valgrind's client-request interface
# from inside the test process. Needs the Valgrind headers and libclang at
# build time, so it is off by default; `scripts/valgrind-test.sh` turns it on.
valgrind = ["dep:crabgrind"]

[lib]
name = "modsecurity"
path = "src/lib.rs"

[[test]]
name = "memcheck"
path = "tests/memcheck.rs"
required-features = ["valgrind"]

[package.metadata.docs.rs]
no-default-features = true
